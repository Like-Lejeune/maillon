name: Tests de l'agent

on:
  pull_request:
    paths: ["agent/**", ".github/workflows/agent.yml"]
  push:
    branches: [develop, main]
    paths: ["agent/**"]

jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests unitaires
        working-directory: agent
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Installeur Linux
        if: runner.os == 'Linux'
        working-directory: agent
        run: |
          bash install.sh
          ~/.local/bin/maillon-agent info

      - name: Installeur Windows
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:LOCALAPPDATA\Maillon\agent\venv\Scripts\maillon-agent.exe" info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
