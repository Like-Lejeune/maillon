name: Tests du serveur

on:
  pull_request:
    paths: ["server/**", ".github/workflows/tests.yml"]
  push:
    branches: [develop, main]
    paths: ["server/**"]

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maillon_test
          POSTGRES_USER: maillon
          POSTGRES_PASSWORD: maillon-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maillon -d maillon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      QUEUE_WAIT_SECONDS: "1"
      JOB_ACK_SECONDS: "1"
      JOB_TIMEOUT_SECONDS: "3"
      HEARTBEAT_INTERVAL_SECONDS: "1"
      HEARTBEAT_TIMEOUT_SECONDS: "3"
      PRESENCE_SWEEP_SECONDS: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: maillon_test
      DB_USER: maillon
      DB_PASSWORD: maillon-test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python -m pytest -q
