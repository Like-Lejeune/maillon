[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maillon-agent"
version = "0.1.0"
description = "Agent installé sur les machines du réseau Maillon"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
maillon-agent = "maillon_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
