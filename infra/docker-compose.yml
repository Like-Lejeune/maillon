# Pile applicative Maillon : serveur, PostgreSQL, Redis.
#
# Le même fichier sert pour la préproduction et la production, sur le même VPS.
# Chaque environnement a son propre dossier, son fichier .env et son nom de
# projet, donc ses propres conteneurs, volumes et base de données :
#
#   docker compose -p maillon-staging    --env-file /srv/maillon/staging/.env    up -d --build
#   docker compose -p maillon-production --env-file /srv/maillon/production/.env up -d --build
#
# Aucun port n'est publié sur Internet ici : seul le proxy HTTPS (infra/edge)
# est exposé, et il joint le serveur par le réseau partagé maillon_edge.

services:
  server:
    build:
      context: ../server
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:?ENV_FILE manquant}
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MODELS_DIR: /models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${MODELS_PATH:?MODELS_PATH manquant}:/models:ro
    networks:
      internal:
      edge:
        aliases:
          - ${STACK_NAME:?STACK_NAME manquant}-server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME manquant}
      POSTGRES_USER: ${DB_USER:?DB_USER manquant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD manquant}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  pgdata:
  redisdata:

networks:
  internal:
  edge:
    name: maillon_edge
    external: true
